[package]
name = "hiveai-desktop"
version = "0.1.0"
description = "H!veAI desktop shell"
authors = ["H!veAI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hiveai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hiveai-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
tauri = "2.11.5"
tauri-plugin-log = "2.9.0"
tauri-plugin-notification = "2.3.3"
